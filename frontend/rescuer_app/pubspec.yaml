name: rescuer
description: "Ứng dụng đối tác Cứu Hộ 24/7."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.18.0
  geolocator: ^14.0.2
  uuid: ^4.5.1
  file_picker: ^10.3.10
  crypto: ^3.0.7
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  http: ^1.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

flutter_launcher_icons:
  image_path: assets/app_icon/rescuer_icon.png
  android: true
  ios: false
  adaptive_icon_background: "#0B1C30"
  adaptive_icon_foreground: assets/app_icon/rescuer_icon.png
